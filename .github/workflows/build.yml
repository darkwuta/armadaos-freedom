name: Y700 personal cloud build
on:
  workflow_dispatch:

# 个人构建仅发布至当前 Fork 的命名空间，不使用作者私钥或声称为作者签名发行版。
permissions:
  contents: read
  packages: write

jobs:
  packages:
    uses: ./.github/workflows/packages.yml
    secrets: inherit

  image:
    name: Assemble ARM64 system image
    needs: packages
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e
        with:
          remove-codeql: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman buildah skopeo jq runc
          mkdir -p ~/.config/containers
          printf '[engine]\nruntime = "runc"\n' > ~/.config/containers/containers.conf
      - name: Authenticate package downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Validate source and resolve plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m unittest discover -s tests -p test_plugin_sources.py
          python3 -m unittest discover -s tests -p test_plasma_runtime.py
          python3 -m unittest discover -s tests -p test_edl_boot_requirements.py
          python3 -m unittest discover -s tests -p test_initramfs_requirement_failure.py
          bash tests/tb323fu-input-test.sh
          python3 build_files/resolve-plugin-sources.py
          gh api 'repos/SteamDeckHomebrew/decky-loader/releases?per_page=100' > "$RUNNER_TEMP/decky-releases.json"
      - name: Set immutable source identity
        id: version
        run: |
          version="$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build local ARM64 image
        env:
          PACKAGE_REFS: ${{ needs.packages.outputs.build_args }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PACKAGE_REFS" > "$RUNNER_TEMP/package-refs.env"
          expected=$(grep -c '^ARG [A-Z0-9_]*_REF$' Containerfile)
          actual=$(grep -c '_REF=' "$RUNNER_TEMP/package-refs.env")
          test "$expected" -eq "$actual"
          podman build --platform linux/arm64 --format oci --target armada-rootfs \
            --security-opt label=disable \
            --build-arg "ARMADA_VERSION=$VERSION" \
            --build-arg-file "$RUNNER_TEMP/package-refs.env" \
            --secret "id=decky_releases,src=$RUNNER_TEMP/decky-releases.json" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label containers.bootc=1 \
            -t localhost/y700-personal:build .
          podman run --rm --entrypoint /bin/sh localhost/y700-personal:build -c 'uname -m; test -e /usr/lib/armada/devices/lenovo-tb323fu.conf'
      - name: Publish personal build for EDL packaging
        id: publish
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:personal-${GITHUB_SHA}"
          podman push --digestfile "$RUNNER_TEMP/image-digest" localhost/y700-personal:build "docker://$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat "$RUNNER_TEMP/image-digest")" >> "$GITHUB_OUTPUT"

  edl:
    name: Package TB323FU installer bundle
    needs: image
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e
        with:
          remove-codeql: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Authenticate personal OCI download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          sudo modprobe btrfs
      - name: Build five-generation deployment bundle
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          set -euo pipefail
          # 原脚本支持自构建 OCI；后续更新仍使用项目原有的签名更新源及公钥。
          bash build_files/build-edl-package.sh \
            --oci "docker://$IMAGE" --manifest-digest "$DIGEST" \
            --source-commit "$GITHUB_SHA" --version "$VERSION" \
            --origin ostree-image-signed:docker://ghcr.io/mydanyi/armadaos-freedom:testing \
            --source "$GITHUB_WORKSPACE" \
            --work "$GITHUB_WORKSPACE/_build-edl-cloud" \
            --output "$GITHUB_WORKSPACE/output/edl" --model TB323FU
      - name: Upload installation files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TB323FU-personal-${{ github.run_id }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            output/edl/**/*.zip.[0-9][0-9][0-9]*
            output/edl/**/*.parts.json
            output/edl/**/SHA256SUMS
            output/edl/**/README*
